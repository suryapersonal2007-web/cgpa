<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CGPA Calculator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    .container {
      max-width: 750px;
      margin: auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .row input {
      padding: 8px;
      flex: 1;
    }

    .header {
      font-weight: bold;
      background: #eee;
      padding: 5px;
    }

    button {
      padding: 12px;
      margin-top: 10px;
      width: 100%;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #0056b3;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      text-align: center;
      font-weight: bold;
    }
  </style>

</head>

<body>

<div class="container">
  <h2>CGPA Calculator</h2>

  <!-- Semester Dropdown -->

  <select onchange="loadSubjects(this.value)">
    <option value="">Select Semester</option>
    <option value="1">Semester 1</option>
    <option value="2">Semester 2</option>
    <option value="3">Semester 3</option>
    <option value="4">Semester 4</option>
  </select>

  <!-- Header Row -->

  <div class="row header">
    <div>Subject</div>
    <div>Credits</div>
    <div>Grade</div>
  </div>

  <!-- Subjects will load here -->

  <div id="subjects"></div>

  <!-- Button -->

<button onclick="calculateCGPA()">Calculate CGPA</button>

  <!-- Result -->

  <div id="result"></div>
</div>

<script src="script.js"></script>

</body>
</html>
