<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CGPA Tracker</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      padding: 20px;
    }

    .container {
      max-width: 750px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
    }

    input, select, button {
      padding: 10px;
      margin: 5px 0;
      width: 100%;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .row input {
      flex: 1;
    }

    .header {
      font-weight: bold;
      background: #eee;
      padding: 5px;
    }

    #result {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
    }
  </style>

</head>

<body>

<!-- 🔐 LOGIN -->

<div id="loginBox" class="container">
  <h2>Login</h2>
  <input type="text" id="username" placeholder="Enter username">
  <button onclick="login()">Login</button>
</div>

<!-- 📊 MAIN APP -->

<div id="app" class="container" style="display:none;">

  <h2>CGPA Tracker</h2>

<button onclick="logout()">Logout</button>

  <select id="semester" onchange="loadSubjects()">
    <option value="">Select Semester</option>
    <option value="1">Semester 1</option>
    <option value="2">Semester 2</option>
    <option value="3">Semester 3</option>
    <option value="4">Semester 4</option>
  </select>

  <div class="row header">
    <div>Subject</div>
    <div>Credits</div>
    <div>Grade</div>
  </div>

  <div id="subjects"></div>

<button onclick="calculateCGPA()">Calculate CGPA</button>

  <div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
